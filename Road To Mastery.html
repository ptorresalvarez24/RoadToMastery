<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Road To Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Epilogue:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:               #f8f8f6;
    --surface:          #f1f1ee;
    --surface-elevated: #ffffff;
    --border:           rgba(20,18,14,0.09);
    --border-mid:       rgba(20,18,14,0.16);
    --text-primary:     #141210;
    --text-secondary:   #3c3830;
    --text-dim:         #908880;
    --accent-blue:      #5a87a8;
    --accent-amber:     #b8923a;
    --accent-teal:      #4e8f68;
    --accent-terra:     #b05e48;
    --font-display:     'Epilogue', sans-serif;
    --font-head:        'Epilogue', sans-serif;
    --font-body:        'Manrope', sans-serif;
    --font-mono:        'JetBrains Mono', monospace;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text-primary); }
  body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); }
  * { scrollbar-width: thin; scrollbar-color: rgba(20,18,14,0.15) transparent; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(20,18,14,0.15); border-radius: 3px; }
  textarea, input { font-family: var(--font-body); color: var(--text-primary); }
  textarea::placeholder, input::placeholder { color: var(--text-dim); }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script>
  if (!window.React || !window.ReactDOM) {
    document.getElementById("root").innerHTML = `
      <div style="max-width:680px;margin:56px auto;padding:24px;border:1px solid rgba(20,18,14,.14);background:#fff;font-family:Manrope,sans-serif;line-height:1.6">
        <h1 style="font-family:Epilogue,sans-serif;font-size:24px;margin:0 0 10px">Unable to load app dependencies</h1>
        <p style="margin:0 0 10px">React CDN assets did not load, so the page could not render.</p>
        <p style="margin:0">Run <code>python serve.py</code> and verify internet access for <code>unpkg.com</code>.</p>
      </div>`;
    throw new Error("Missing React/ReactDOM globals.");
  }
</script>

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentScheme": "Ink",
  "fontDisplay": "Epilogue",
  "fontBody": "Manrope",
  "navShadow": true
}/*EDITMODE-END*/;
</script>
<script src="app.bundle.js"></script>
</body>
</html>
