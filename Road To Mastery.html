<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Epilogue:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:               #f8f8f6;
    --surface:          #f1f1ee;
    --surface-elevated: #ffffff;
    --border:           rgba(20,18,14,0.09);
    --border-mid:       rgba(20,18,14,0.16);
    --text-primary:     #141210;
    --text-secondary:   #3c3830;
    --text-dim:         #908880;
    --accent-blue:      #5a87a8;
    --accent-amber:     #b8923a;
    --accent-teal:      #4e8f68;
    --accent-terra:     #b05e48;
    --font-display:     'Epilogue', sans-serif;
    --font-head:        'Epilogue', sans-serif;
    --font-body:        'Manrope', sans-serif;
    --font-mono:        'JetBrains Mono', monospace;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text-primary); }
  body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); }
  * { scrollbar-width: thin; scrollbar-color: rgba(20,18,14,0.15) transparent; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(20,18,14,0.15); border-radius: 3px; }
  textarea, input { font-family: var(--font-body); color: var(--text-primary); }
  textarea::placeholder, input::placeholder { color: var(--text-dim); }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
